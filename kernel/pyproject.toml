[project]
name = "motherbridge-kernel"
version = "0.1.0"
description = "MotherBridge kernel — the invisible AI OS beneath JABBNETWORKS AIOS Enterprise."
requires-python = ">=3.11"
readme = "README.md"
# Core package (motherbridge/) is dependency-free. Extras add the HTTP surface.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["motherbridge"]
